<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>SoftGL — 200 Test Cycle (640×360)</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0a0a; color: #ddd;
               font-family: ui-monospace, monospace; }
  .wrap { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
  h1 { font-weight: 400; font-size: 20px; margin: 0 0 16px; color: #aaa; }
  .stage { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges;
           background: #000; border: 1px solid #333; width: 640px; height: 360px; }
  .info { flex: 1; min-width: 320px; }
  .counter { font-size: 14px; color: #777; margin-bottom: 8px; }
  .name { font-size: 16px; color: #8bf; margin-bottom: 12px; word-break: break-all; }
  .timing { font-size: 12px; color: #555; }
  .bar { height: 2px; background: #222; margin-top: 10px; position: relative; }
  .bar > div { height: 100%; background: #8bf; width: 0; transition: width 3s linear; }
  button { background: #222; color: #ddd; border: 1px solid #444; padding: 6px 12px;
           font: inherit; cursor: pointer; margin-right: 8px; }
  button:hover { background: #333; }
</style>
</head>
<body>
<div class="wrap">
  <h1>SoftGL — 200 Test Cycle @ 640×360 (3 s / Test, looping)</h1>
  <div class="stage">
    <canvas id="c" width="640" height="360"></canvas>
    <div class="info">
      <div class="counter" id="counter">–</div>
      <div class="name" id="name">Loading WASM…</div>
      <div class="timing" id="timing"></div>
      <div class="bar"><div id="prog"></div></div>
      <div style="margin-top: 16px;">
        <button id="pause">Pause</button>
        <button id="prev">&lsaquo; Prev</button>
        <button id="next">Next &rsaquo;</button>
      </div>
    </div>
  </div>
</div>
<script src="softgl.js"></script>
<script src="main.js"></script>
</body>
</html>
